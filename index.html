<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12-0 Gridiron Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Archivo:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: stadium scoreboard. Three amber reel panels up top, the spun program's depth chart below, your 19-man roster card beside it (stacked on phones). */
:root{
  --bg:#0a0a0a; --panel:#151515; --panel2:#1e1e1e; --line:#333333;
  --chalk:#f2f2f0; --muted:#a6a6a3; --amber:#ffb22e; --amber-ink:#2a1a00; --amber-glow:rgba(255,178,46,.18);
  --win:#5fd38d; --loss:#ff6f5e; --pit:#000000;
  --display:"Graduate","Rockwell","Georgia",serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--chalk)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  background-image:repeating-linear-gradient(90deg,transparent 0 59px,rgba(238,241,230,.035) 59px 60px);}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.prow:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:12px}
header.top h1{font-size:clamp(28px,6vw,44px);line-height:1}
header.top h1 b{color:var(--amber);font-weight:400}
.hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.chip.on{border-color:var(--amber);color:var(--amber)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent}

/* home */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left}
.mode:hover{border-color:var(--amber)}
.mode h2{font-size:26px}
.mode p{margin:0;color:var(--muted);max-width:42ch}
.mode .go{margin-top:auto;font-family:var(--mono);color:var(--amber);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:18px;margin-bottom:10px}
.rules{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.rules b{color:var(--chalk);font-weight:600}
.best{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.best li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:8px}
.best .rec{font-family:var(--display);font-size:18px;color:var(--amber)}
.best .meta{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:14px}

/* reels */
.board{background:var(--pit);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.reels{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.reel{display:flex;flex-direction:column;gap:6px;min-width:0}
.window{background:#000;border:1px solid #2a2a1a;border-radius:10px;padding:12px 8px;text-align:center;min-height:62px;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);color:var(--amber);font-size:clamp(15px,3.6vw,24px);line-height:1.1;text-shadow:0 0 12px var(--amber-glow),0 0 2px var(--amber);
  background-image:radial-gradient(rgba(255,178,46,.07) 1px,transparent 1.5px);background-size:5px 5px;overflow:hidden;word-break:break-word}
.window.spinning{filter:blur(.6px);opacity:.85}
.reroll{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.reroll:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.reroll:disabled{opacity:.35;cursor:not-allowed}
.reroll .n{color:var(--chalk)}
.pips{display:inline-flex;gap:3px}
.pip{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.pip.used{background:var(--line)}
.note{font-size:12px;color:var(--muted);font-family:var(--mono)}

/* draft layout */
.draft{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.draft{grid-template-columns:1fr}}
.depth{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px}
.depth-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.depth-head h2{font-size:22px}
.posgroup{display:flex;flex-direction:column;gap:4px}
.posgroup .gh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:2px}
.posgroup .gh span:first-child{font-family:var(--display);font-size:15px}
.posgroup.closed{opacity:.45}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid transparent;text-align:left;width:100%}
.prow{cursor:pointer}.prow:hover:not(.dis){border-color:var(--muted)}
.prow.dis{cursor:default;opacity:.5}
.prow.open{border-color:var(--amber)}
.pname{font-weight:700;min-width:0}
.badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px;border:1px solid var(--amber);color:var(--amber)}
.badge.C{border-color:var(--chalk);color:var(--chalk)}
.badge.A{border-color:var(--muted);color:var(--muted)}
.pstats{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pstats b{color:var(--chalk);font-weight:500}
.slotpick{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:4px}
.slotpick .lbl{font-size:12px;color:var(--muted)}
.slotbtn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:6px;padding:6px 12px;font-weight:800;font-size:13px}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* roster */
.roster{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.roster h2{font-size:22px}
.side h3{font-size:14px;color:var(--muted);font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.slots{display:flex;flex-direction:column;gap:4px}
.slot{display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;background:var(--panel2);min-height:38px}
.slot.emptyslot{background:transparent;border:1px dashed var(--line)}
.slot .sl{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.06em}
.slot .who{min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .who small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.slot .x{background:transparent;border:1px solid var(--line);border-radius:6px;width:28px;height:28px;color:var(--muted)}
.slot .x:hover{color:var(--loss);border-color:var(--loss)}
.slot .ov{font-family:var(--display);color:var(--amber);font-size:17px}
.progress{height:6px;background:var(--pit);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--amber);transition:width .3s}

/* results */
.hero{background:var(--pit);border:2px solid var(--line);border-radius:16px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.record{font-family:var(--display);font-size:clamp(64px,16vw,120px);line-height:.9;color:var(--amber);text-shadow:0 0 22px var(--amber-glow)}
.verdict h2{font-size:clamp(22px,4.5vw,34px)}
.verdict p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grade{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.grade .g{font-family:var(--display);font-size:34px;line-height:1}
.grade .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.games{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.games li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:8px;animation:drop .35s ease-out both}
.games li .wk{font-family:var(--mono);font-size:11px;color:var(--muted)}
.games li .r{font-family:var(--display);font-size:16px}
.games li.W .r{color:var(--win)} .games li.L .r{color:var(--loss)}
.games li.title{grid-column:1/-1;border:1px solid var(--amber)}
.games li .sc{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}
@keyframes drop{from{transform:translateY(-6px);opacity:.2}to{transform:none;opacity:1}}
.actions{display:flex;gap:10px;flex-wrap:wrap}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;max-width:80ch}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--amber);color:var(--amber-ink);font-weight:700;padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

      const seen=new Set(); byPos[pos]=[];
      for(const chunk of line.slice(sp+1).split(';')){
        const f=chunk.split(','); const name=(f[0]||'').trim(); const a=+f[1]||0, b=+f[2]||0, h=(f[3]||'').trim();
        if(!name||name.includes('?')||(a===0&&b===0)||seen.has(name)) continue;
        seen.add(name);
        const p={id:++uid,name,pos,a,b,h,team:t.name,conf:t.conf,dec:label}; p.ovr=rate(p);
        byPos[pos].push(p); count++;
      }
    }
    if(count>=15) DB[t.name][label]=byPos; // skip program-decades too thin to draft from
  }
}
const CONFS=['SEC','Big Ten','ACC','Big 12','Independent'];
const teamsIn=c=>TEAMS.filter(t=>t.conf===c&&Object.keys(DB[t.name]).length).map(t=>t.name);
const decadesFor=team=>Object.keys(DB[team]);

const SLOTS=[
 {id:'QB',lbl:'QB',side:'O',pos:['QB'],w:.25},
 {id:'RB1',lbl:'RB',side:'O',pos:['RB'],w:.10},{id:'RB2',lbl:'RB',side:'O',pos:['RB'],w:.10},
 {id:'TE',lbl:'TE',side:'O',pos:['TE'],w:.08},{id:'WR',lbl:'WR',side:'O',pos:['WR'],w:.12},
 {id:'OF1',lbl:'FLEX',side:'O',pos:['RB','WR','TE'],w:.12},{id:'OF2',lbl:'FLEX',side:'O',pos:['RB','WR','TE'],w:.12},{id:'OF3',lbl:'FLEX',side:'O',pos:['RB','WR','TE'],w:.11},
 {id:'DE1',lbl:'DE',side:'D',pos:['DE'],w:.10},{id:'DE2',lbl:'DE',side:'D',pos:['DE'],w:.10},{id:'DT',lbl:'DT',side:'D',pos:['DT'],w:.10},
 {id:'LB1',lbl:'LB',side:'D',pos:['LB'],w:.09},{id:'LB2',lbl:'LB',side:'D',pos:['LB'],w:.09},
 {id:'CB1',lbl:'CB',side:'D',pos:['CB'],w:.09},{id:'CB2',lbl:'CB',side:'D',pos:['CB'],w:.09},
 {id:'S1',lbl:'S',side:'D',pos:['S'],w:.08},{id:'S2',lbl:'S',side:'D',pos:['S'],w:.08},
 {id:'DF1',lbl:'FLEX',side:'D',pos:['DE','DT','LB','CB','S'],w:.09},{id:'DF2',lbl:'FLEX',side:'D',pos:['DE','DT','LB','CB','S'],w:.09}
];

/* ---------- state ---------- */
const REROLLS=5;
let S=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function newGame(mode){
  S={mode,phase:'draft',roster:{},rr:{conf:REROLLS,team:REROLLS,dec:REROLLS},spin:null,openId:null,spinning:{}};
  spinAll(false);
}
const unlimited=()=>S.mode==='natty';
const openSlotsFor=pos=>SLOTS.filter(s=>!S.roster[s.id]&&s.pos.includes(pos));
const onRoster=name=>Object.values(S.roster).some(p=>p.name===name);
function pickable(spin){const lists=DB[spin.team][spin.dec];return POS.some(pos=>(lists[pos]||[]).some(p=>!onRoster(p.name))&&openSlotsFor(pos).length)}

function rollConf(){return pick(CONFS.filter(c=>teamsIn(c).length))}
function rollTeam(conf,avoid){const opts=teamsIn(conf);const o=opts.length>1?opts.filter(t=>t!==avoid):opts;return pick(o)}
function rollDec(team,avoid){const opts=decadesFor(team);const o=opts.length>1?opts.filter(d=>d!==avoid):opts;return pick(o)}

function spinAll(animate=true){
  let s,tries=0;
  do{const conf=rollConf();const team=rollTeam(conf);s={conf,team,dec:rollDec(team)};tries++}while(!pickable(s)&&tries<200);
  S.spin=s;S.openId=null;
  animateReels(['conf','team','dec'],animate);
}
function reroll(which){
  if(!unlimited()){ if(S.rr[which]<=0) return; S.rr[which]--; }
  const s={...S.spin};
  if(which==='conf'){
    const others=CONFS.filter(c=>c!==s.conf&&teamsIn(c).length);
    s.conf=pick(others); s.team=rollTeam(s.conf); s.dec=decadesFor(s.team).includes(s.dec)?s.dec:rollDec(s.team);
  } else if(which==='team'){
    s.team=rollTeam(s.conf,s.team); if(!decadesFor(s.team).includes(s.dec)) s.dec=rollDec(s.team);
  } else s.dec=rollDec(s.team,s.dec);
  S.spin=s;S.openId=null;
  const reels= which==='conf'?['conf','team']:[which];
  if(!decadesFor(s.team).includes(S.spin.dec)) reels.push('dec');
  animateReels(reels,true);
  if(!pickable(s)) toast('Nobody here fits an open slot. Reroll again'+(unlimited()?'.':' or spin past it.'));
}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateReels(keys,animate){
  if(!animate||reduce){render();return}
  keys.forEach(k=>S.spinning[k]=true); render();
  const pools={conf:CONFS,team:TEAMS.map(t=>t.name),dec:DEC_KEYS.map(d=>d[1])};
  keys.forEach((k,i)=>{
    const el=document.getElementById('reel-'+k); let n=0; const stop=7+i*4;
    const iv=setInterval(()=>{ if(el) el.textContent=pick(pools[k]); if(++n>=stop){clearInterval(iv);S.spinning[k]=false;if(keys.every(x=>!S.spinning[x]))render(); else if(el){el.textContent=label(k);el.classList.remove('spinning')}}},70);
  });
}
const label=k=>k==='dec'?S.spin.dec:S.spin[k];

function draftPlayer(pid,slotId){
  const lists=DB[S.spin.team][S.spin.dec]; let p=null;
  for(const pos of POS) for(const x of (lists[pos]||[])) if(x.id===pid) p=x;
  if(!p||S.roster[slotId]) return;
  S.roster[slotId]=p;
  if(Object.keys(S.roster).length===SLOTS.length){S.openId=null;render();return}
  if(S.mode==='classic') spinAll(true); else {S.openId=null;render()}
}
function release(slotId){delete S.roster[slotId];render()}

/* ---------- sim ---------- */
const CUPCAKE=['Kent State','Akron','UMass','New Mexico State','Charlotte','Georgia State','UTEP','Ball State','Bowling Green','Louisiana-Monroe'];
const MID=['Iowa','Wisconsin','Kansas State','Utah','Ole Miss','Arkansas','Virginia Tech','Louisville','Baylor','TCU','Washington','UCLA','Missouri','Kentucky','Michigan State','Oklahoma State','South Carolina','Texas A&M','Arizona State','Pitt'];
const ELITE=['Alabama','Georgia','Ohio State','Michigan','Texas','LSU','Clemson','Oregon','USC','Notre Dame','Florida State','Penn State','Miami','Oklahoma'];
function ratings(){
  const side=sd=>{let s=0,w=0;for(const sl of SLOTS.filter(x=>x.side===sd)){s+=S.roster[sl.id].ovr*sl.w;w+=sl.w}return s/w};
  const o=side('O'),d=side('D');return {off:o,def:d,ovr:o*.55+d*.45};
}
const winP=(us,them)=>1/(1+Math.exp(-(us-them)/2.9));
function score(win,margin){const base=win?20+Math.round(Math.random()*24):10+Math.round(Math.random()*17);const m=Math.max(1,Math.round(margin));return win?[base+m,base]:[base,base+m]}
function simulate(){
  const R=ratings();
  const opp=[...shuffle(CUPCAKE).slice(0,3).map(n=>({n,r:63+Math.random()*9})),...shuffle(MID).slice(0,5).map(n=>({n,r:75+Math.random()*9})),...shuffle(ELITE).slice(0,4).map(n=>({n,r:84+Math.random()*7}))];
  const sched=shuffle(opp); const games=[]; let w=0;
  for(const g of sched){const p=winP(R.ovr+(Math.random()*4-2),g.r);const win=Math.random()<p;if(win)w++;games.push({...g,win,sc:score(win,Math.abs(R.ovr-g.r)/2+Math.random()*10)})}
  let bowl;
  if(w>=11){const o={n:pick(ELITE),r:89+Math.random()*5};const win=Math.random()<winP(R.ovr,o.r);bowl={...o,win,title:true,sc:score(win,2+Math.random()*12)}}
  else {const o={n:pick(MID),r:76+Math.random()*8};const win=Math.random()<winP(R.ovr,o.r);bowl={...o,win,title:false,sc:score(win,3+Math.random()*12)}}
  return {R,games,w,bowl};
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function letter(x){return x>=95?'A+':x>=92?'A':x>=89?'A-':x>=86?'B+':x>=83?'B':x>=80?'B-':x>=77?'C+':x>=74?'C':x>=70?'C-':'D'}

/* ---------- saved runs ---------- */
const KEY='gridiron120-best';
function loadBest(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function saveRun(run){try{const b=loadBest();b.push(run);b.sort((x,y)=>(y.w+(y.natty?1:0))-(x.w+(x.natty?1:0))||y.ovr-x.ovr);localStorage.setItem(KEY,JSON.stringify(b.slice(0,10)))}catch(e){}}

/* ---------- render ---------- */
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function header(){
  const m=S?S.mode:null;
  return `<header class="top"><div><div class="eyebrow">College football · 1980s to today</div><h1>12<b>-</b>0 Gridiron Draft</h1></div>
  <div class="hdr-right">${m?`<span class="chip on">${m==='classic'?'Classic':'Natty or Bust'}</span><button class="btn ghost" data-act="home">Quit to menu</button>`:''}</div></header>`;
}
function home(){
  const best=loadBest();
  const tc=TEAMS.length, dc=TEAMS.reduce((n,t)=>n+decadesFor(t.name).length,0);
  app.innerHTML=header()+`
  <div class="modes">
    <button class="mode" data-act="start" data-mode="classic"><span class="eyebrow">Mode 1</span><h2>Classic</h2>
      <p>Spin conference, program and decade. Draft one player per spin. Five rerolls on each wheel for the whole draft, so spend them wisely.</p><span class="go">Kick off →</span></button>
    <button class="mode" data-act="start" data-mode="natty"><span class="eyebrow">Mode 2</span><h2>Natty or Bust</h2>
      <p>Same wheels, no limits. Reroll as often as you like, cut players you've drafted, and hand-build the best roster the pool allows.</p><span class="go">Build the dream →</span></button>
  </div>
  <div class="grid2">
    <div class="card"><h3>How a season plays</h3><ol class="rules">
      <li><b>19 picks.</b> Offense: QB, 2 RB, TE, WR, 3 FLEX (RB/WR/TE). Defense: 2 DE, DT, 2 LB, 2 CB, 2 S, 2 FLEX (any defender).</li>
      <li><b>Stats show, ratings don't.</b> You see each player's career numbers at that school and his honors. Overall ratings reveal after the season.</li>
      <li><b>12 games, then a bowl.</b> Finish 11-1 or better and you play for the national title. Run the table and win it for a perfect 13-0.</li>
    </ol></div>
    <div class="card"><h3>Best runs on this device</h3>${best.length?`<ul class="best">${best.map(b=>`<li><span class="rec">${b.w}-${12-b.w}</span><span class="meta">${b.natty?'🏆 National champs · ':''}${esc(b.mode)} · OVR ${b.ovr.toFixed(1)} · QB ${esc(b.qb)}</span><span class="tag">${esc(b.date)}</span></li>`).join('')}</ul>`:`<p class="empty">No seasons yet. Your top ten records will show up here.</p>`}</div>
  </div>
  <footer>${tc} programs, ${dc} program-decades, top five per position. Stats are approximate career totals at that school, compiled for this game; some older program-decades have shorter lists, and a few too thin to draft from are left off the wheel.</footer>`;
}
function reelHTML(k,name){
  const n=S.rr[k];const un=unlimited();
  return `<div class="reel"><div class="eyebrow">${name}</div><div class="window ${S.spinning[k]?'spinning':''}" id="reel-${k}">${esc(label(k))}</div>
  <button class="reroll" data-act="reroll" data-w="${k}" ${(!un&&n<=0)||Object.values(S.spinning).some(Boolean)?'disabled':''} aria-label="Reroll ${name}">↻ Reroll ${un?'<span class="n">∞</span>':`<span class="pips">${[0,1,2,3,4].map(i=>`<i class="pip ${i<REROLLS-n?'used':''}"></i>`).join('')}</span>`}</button></div>`;
}
function draftView(){
  const filled=Object.keys(S.roster).length, done=filled===SLOTS.length;
  const lists=DB[S.spin.team][S.spin.dec];
  const groups=POS.map(pos=>{
    const ps=lists[pos]||[]; const open=openSlotsFor(pos);
    const rows=ps.length?ps.map(p=>{
      const taken=onRoster(p.name); const dis=taken||!open.length||done;
      const isOpen=S.openId===p.id&&!dis;
      return `<div class="prow ${isOpen?'open':''} ${dis?'dis':''}" ${dis?'aria-disabled="true"':'role="button" tabindex="0" data-act="sel" data-id="'+p.id+'"'}>
        <span class="pname">${esc(p.name)}${p.h?`<span class="badge ${p.h}">${HONOR[p.h]}</span>`:''}</span>
        <span class="pstats"><b>${p.a.toLocaleString()}</b> ${STAT[pos][0]} · <b>${p.b}</b> ${STAT[pos][1]}${taken?' · on roster':''}</span>
        ${isOpen?`<span class="slotpick"><span class="lbl">Put him at</span>${open.map(s=>`<button class="slotbtn" data-act="draft" data-id="${p.id}" data-slot="${s.id}">${s.lbl}</button>`).join('')}</span>`:''}
      </div>`}).join(''):`<span class="tag">No players listed for this decade.</span>`;
    return `<div class="posgroup ${open.length?'':'closed'}"><div class="gh"><span>${POS_NAME[pos]}</span><span class="tag">${open.length?open.length+' open slot'+(open.length>1?'s':''):'filled'}</span></div>${rows}</div>`;
  }).join('');
  const side=sd=>SLOTS.filter(s=>s.side===sd).map(s=>{const p=S.roster[s.id];
    return p?`<div class="slot"><span class="sl">${s.lbl}</span><span class="who">${esc(p.name)}<small>${p.pos} · ${esc(p.team)} ${p.dec}</small></span>${unlimited()?`<button class="x" data-act="cut" data-slot="${s.id}" aria-label="Cut ${esc(p.name)}">×</button>`:'<span></span>'}</div>`
      :`<div class="slot emptyslot"><span class="sl">${s.lbl}</span><span class="who tag">${s.pos.join(' / ')}</span><span></span></div>`}).join('');
  app.innerHTML=header()+`
  <section class="board" aria-label="Spinner">
    <div class="board-top"><span class="eyebrow">Pick ${Math.min(filled+1,SLOTS.length)} of ${SLOTS.length}</span>
      <span class="note">${unlimited()?'Unlimited rerolls · tap × to cut a player':'Rerolling conference also re-spins the program'}</span></div>
    <div class="reels">${reelHTML('conf','Conference')}${reelHTML('team','Program')}${reelHTML('dec','Decade')}</div>
    ${unlimited()?`<button class="btn" data-act="spinall">Spin all three</button>`:(!pickable(S.spin)&&filled<SLOTS.length?`<button class="btn" data-act="spinall">Nobody fits. Spin again (free)</button>`:'')}
  </section>
  <div class="draft">
    <section class="depth"><div class="depth-head"><h2>${esc(S.spin.team)} · ${S.spin.dec}</h2><span class="tag">Tap a player, then a slot</span></div>${groups}</section>
    <aside class="roster"><div class="depth-head"><h2>Your roster</h2><span class="tag mono">${filled}/${SLOTS.length}</span></div>
      <div class="progress"><i style="width:${filled/SLOTS.length*100}%"></i></div>
      ${done?`<button class="btn primary" data-act="sim">Simulate the season</button>`:''}
      <div class="side"><h3>Offense</h3><div class="slots">${side('O')}</div></div>
      <div class="side"><h3>Defense</h3><div class="slots">${side('D')}</div></div>
    </aside>
  </div>`;
}
function resultsView(){
  const r=S.result, R=r.R, b=r.bowl, perfect=r.w===12&&b.title&&b.win;
  const total=r.w+(b.win?1:0), losses=12-r.w+(b.win?0:1);
  let head,sub;
  if(perfect){head='Perfect season. National champions.';sub='You ran the table and won the title game. That is the whole goal.'}
  else if(b.title&&b.win){head='National champions';sub=`One slip in the regular season, but you won it all. Not quite 13-0.`}
  else if(b.title){head='Lost the title game';sub=`${r.w}-${12-r.w} got you to the national championship, where ${esc(b.n)} beat you.`}
  else {head=r.w>=9?'Good year, no title shot':'Rebuilding year';sub=`You needed 11 wins to play for the title. ${b.win?'At least you won the bowl.':'And the bowl game got away too.'}`}
  const list=[...r.games.map((g,i)=>({...g,wk:'W'+(i+1)})),{...b,wk:b.title?'NC':'BWL'}];
  const rosterRows=sd=>SLOTS.filter(s=>s.side===sd).map(s=>{const p=S.roster[s.id];return `<div class="slot"><span class="sl">${s.lbl}</span><span class="who">${esc(p.name)}<small>${p.pos} · ${esc(p.team)} ${p.dec}</small></span><span class="ov">${p.ovr}</span></div>`}).join('');
  app.innerHTML=header()+`
  <section class="hero"><div class="record">${total}-${losses}</div><div class="verdict"><div class="eyebrow">${S.mode==='classic'?'Classic':'Natty or Bust'} · final record incl. bowl</div><h2>${head}</h2><p>${sub}</p></div></section>
  <div class="grades">
    <div class="grade"><div class="eyebrow">Offense</div><div class="g">${letter(R.off)}</div><div class="n">${R.off.toFixed(1)}</div></div>
    <div class="grade"><div class="eyebrow">Defense</div><div class="g">${letter(R.def)}</div><div class="n">${R.def.toFixed(1)}</div></div>
    <div class="grade"><div class="eyebrow">Team</div><div class="g" style="color:var(--amber)">${letter(R.ovr)}</div><div class="n">${R.ovr.toFixed(1)} OVR</div></div>
  </div>
  <section class="card"><h3>Schedule</h3><ul class="games">${list.map((g,i)=>`<li class="${g.win?'W':'L'} ${g.wk==='NC'?'title':''}" style="animation-delay:${i*60}ms"><span class="wk">${g.wk}</span><span>${g.wk==='NC'?'National Championship vs ':g.wk==='BWL'?'Bowl vs ':''}${esc(g.n)}</span><span><span class="r">${g.win?'W':'L'}</span><span class="sc">${g.sc[0]}-${g.sc[1]}</span></span></li>`).join('')}</ul></section>
  <div class="grid2"><section class="card"><h3>Offense · ratings revealed</h3><div class="slots">${rosterRows('O')}</div></section>
  <section class="card"><h3>Defense · ratings revealed</h3><div class="slots">${rosterRows('D')}</div></section></div>
  <div class="actions"><button class="btn primary" data-act="resim">Replay this season</button><button class="btn" data-act="start" data-mode="${S.mode}">New draft</button><button class="btn ghost" data-act="home">Menu</button></div>`;
}
function render(){ if(!S) return home(); if(S.phase==='results') return resultsView(); draftView(); }

let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

function runSeason(save){
  S.result=simulate();S.phase='results';
  if(save){const R=S.result.R;saveRun({w:S.result.w,natty:S.result.bowl.title&&S.result.bowl.win,ovr:R.ovr,mode:S.mode==='classic'?'Classic':'Natty or Bust',qb:S.roster.QB.name,date:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})})}
  render();window.scrollTo({top:0});
}
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act;
  if(a==='home'){S=null;render()}
  else if(a==='start'){newGame(el.dataset.mode);window.scrollTo({top:0})}
  else if(a==='reroll') reroll(el.dataset.w);
  else if(a==='spinall'){spinAll(true)}
  else if(a==='sel'){const id=+el.dataset.id;S.openId=S.openId===id?null:id;render()}
  else if(a==='draft'){e.stopPropagation();draftPlayer(+el.dataset.id,el.dataset.slot)}
  else if(a==='cut') release(el.dataset.slot);
  else if(a==='sim') runSeason(true);
  else if(a==='resim') runSeason(false);
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('prow')&&e.target.dataset.act){e.preventDefault();e.target.click()}});
render();
</script>

</body>
