<meta name="apple-mobile-web-app-title" content="12-0 Gridiron">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060a18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Layout: night-game stadium. Top bar + three framed slot reels, a field with your 19 jerseys in formation, a big DRAFT button; the spun roster slides up as a sheet over the field. */
:root{
  --night:#060a18; --navy:#0d1430; --card:#121a38; --card2:#18224a; --line:#28376a;
  --text:#ffffff; --muted:#8e9bc6; --blue:#2f7dff; --blue-deep:#1749b8; --red:#cc2133; --red-deep:#7c0f1c; --gold:#f2b526;
  --reel-ink:#1e2a9a; --win:#3ddc8f; --loss:#ff5c5c;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--text)}
html.fixed,html.fixed body{height:100%;overflow:hidden}
body{font-family:var(--body);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(60% 30% at 8% 6%,rgba(255,60,70,.28),transparent 70%),
   radial-gradient(60% 30% at 92% 6%,rgba(60,120,255,.30),transparent 70%),
   radial-gradient(120% 50% at 50% 0%,#18213f 0%,transparent 70%),
   repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.035) 0 1px,transparent 1px 4px),
   var(--night)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.disp{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
.screen{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-block:10px 12px}
.scroll .screen{height:auto;min-height:100%}

/* top bar */
.topbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}
.back{width:44px;height:44px;border-radius:50%;background:rgba(6,10,24,.85);border:1px solid var(--line);display:grid;place-items:center}
.back svg{width:18px;height:18px}
.coin{justify-self:center;display:flex;align-items:center}
.coin .c{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe49a,#e3a21f 55%,#9c6810);display:grid;place-items:center;box-shadow:0 0 0 2px #7a520b,0 3px 8px rgba(0,0,0,.5);z-index:1}
.coin .c svg{width:22px;height:22px}
.coin .n{margin-left:-10px;padding:5px 18px 5px 20px;background:#0a0f22;border:1px solid var(--line);clip-path:polygon(0 0,100% 0,90% 100%,0 100%);font-family:var(--display);font-weight:700;font-size:18px;min-width:84px;text-align:center}
.round{text-align:center;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;margin-top:6px;text-transform:uppercase}
.segs{display:grid;gap:4px;margin:6px 4px 10px}
.segs i{height:4px;border-radius:3px;background:rgba(255,255,255,.12)}
.segs i.on{background:var(--blue);box-shadow:0 0 8px var(--blue)}

/* reels */
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.frame{border-radius:12px;padding:3px 5px 6px;border:2px solid rgba(255,255,255,.75);box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);min-width:0}
.frame.r{background:linear-gradient(#d22a3b,#7c0f1c)}
.frame.n{background:linear-gradient(#2a3666,#0d1430);border-color:var(--gold)}
.frame.b{background:linear-gradient(#2a5bd8,#10287a)}
.frame .lab{text-align:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;padding:1px 0 3px;white-space:nowrap}
.win{position:relative;height:78px;border-radius:9px;overflow:hidden;border:3px solid #3a3f4c;
  background:linear-gradient(#7d8290 0%,#f3f4f7 26%,#ffffff 50%,#f3f4f7 74%,#7d8290 100%)}
.win::before,.win::after{content:"";position:absolute;top:0;bottom:0;width:5px;z-index:2;background:linear-gradient(var(--blue) 0 50%,var(--red) 50%)}
.win::before{left:0}.win::after{right:0}
.win .shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(rgba(40,44,56,.55),transparent 30%,transparent 70%,rgba(40,44,56,.55))}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.item{height:52px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:var(--reel-ink);font-size:clamp(22px,7vw,36px);line-height:1;white-space:nowrap;letter-spacing:.01em}
.item.q{font-size:38px}
.rerolls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.rr{display:flex;align-items:center;justify-content:center;gap:5px;height:40px;border-radius:9px;border:1.5px solid rgba(255,255,255,.55);font-family:var(--display);font-weight:800;font-size:clamp(13px,3.9vw,17px);letter-spacing:.02em;min-width:0;padding:0 6px;white-space:nowrap;overflow:hidden}
.rr svg{width:16px;height:16px;flex:none}
.rr .k{background:rgba(0,0,0,.35);border-radius:5px;padding:0 5px;font-size:.85em;flex:none}
.rr.r{background:linear-gradient(#d22a3b,#8e1220)}
.rr.n{background:linear-gradient(#2a3666,#121a3c);border-color:var(--gold)}
.rr.b{background:linear-gradient(#2a5bd8,#12309a)}
.rr:disabled{opacity:.35;cursor:not-allowed}

/* stage: field + sheet */
.stage{position:relative;flex:1;min-height:0;margin-top:10px}
.field{position:absolute;inset:0 0 92px 0}
.turf{position:absolute;inset:0;clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);
  background:repeating-linear-gradient(0deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.16) calc(10% - 2px) 10%),
   repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 18px,rgba(255,255,255,.03) 18px 36px),
   radial-gradient(80% 60% at 50% 40%,#3f8a2c,#1f5a1c 70%,#0f3712)}
.turf::after{content:"";position:absolute;left:0;right:0;top:47%;height:2px;background:rgba(80,160,255,.6);box-shadow:0 0 10px rgba(80,160,255,.8)}
.side-tag{position:absolute;left:12%;font-family:var(--display);font-weight:800;font-style:italic;font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.jer{position:absolute;transform:translate(-50%,-50%);width:clamp(40px,12vw,56px);display:flex;flex-direction:column;align-items:center;gap:0}
.jer svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));position:relative;z-index:1}
.jer .ring{width:86%;height:9px;margin-top:-6px;border-radius:50%;border:2px solid rgba(90,170,255,.85);box-shadow:0 0 8px rgba(90,170,255,.8)}
.jer .pl{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.02em;color:#dfe5f2;text-shadow:0 1px 2px #000;margin-top:1px;white-space:nowrap}
.jer.empty svg{opacity:.85}
.jer.filled .ring{border-color:var(--gold);box-shadow:0 0 8px rgba(242,181,38,.8)}
.jer.filled{cursor:pointer}
.jer.pop svg{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3) translateY(-20px)}100%{transform:none}}
.draftbtn{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(82%,340px);height:70px;}
.draftbtn span{display:grid;place-items:center;height:100%;transform:skewX(-14deg);border-radius:6px;border:2px solid #9cc2ff;
  background:linear-gradient(#5aa0ff,#2f7dff 45%,#1b5be0);box-shadow:0 0 22px rgba(47,125,255,.75),0 6px 0 #0d2c78;}
.draftbtn b{transform:skewX(14deg);font-family:var(--display);font-weight:900;font-style:italic;font-size:42px;letter-spacing:.02em;text-shadow:0 3px 0 #0d2c78}
.draftbtn.gold span{background:linear-gradient(#ffd774,#f2b526 50%,#c98b0b);border-color:#ffe8a8;box-shadow:0 0 22px rgba(242,181,38,.7),0 6px 0 #6b4a05}
.draftbtn.gold b{color:#2a1a00;text-shadow:none;font-size:30px}
.draftbtn:disabled{opacity:.55;cursor:wait}

.sheet{position:absolute;inset:0;z-index:5;background:var(--navy);transform:translateY(103%);transition:transform .45s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;
  border-top:2px solid var(--blue);box-shadow:0 -10px 30px rgba(0,0,0,.6);border-radius:4px 4px 0 0}
.sheet.open{transform:none}
.sheet .tab{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:150px;height:18px;background:var(--navy);border:2px solid var(--blue);border-bottom:0;clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);display:grid;place-items:center}
.sheet .tab svg{width:16px;height:16px}
.sh-head{padding:12px 4px 8px;display:flex;flex-direction:column;gap:10px}
.sh-title{font-family:var(--display);font-weight:800;font-style:italic;font-size:24px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.search{flex:0 0 120px;min-width:0;background:#0a1026;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:8px 10px;font-family:var(--display);font-style:italic;font-size:17px}
.search::placeholder{color:#5b678f}
.fchip{flex:none;padding:6px 11px;border-radius:6px;background:var(--card2);border:1px solid var(--line);font-family:var(--display);font-weight:800;font-style:italic;font-size:17px;color:#b9c3e6}
.fchip.on{border-color:var(--blue);color:#7fb0ff;background:#13245a}
.fchip.zero{opacity:.35}
.list{flex:1;min-height:0;overflow-y:auto;padding:4px 2px 16px;display:flex;flex-direction:column;gap:8px}
.pc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.pc:hover:not(:disabled){border-color:#4a63b0;background:#152050}
.pc:disabled{opacity:.38;cursor:default}
.pos{display:grid;place-items:center;height:32px;border-radius:6px;background:#0a1026;border:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:16px}
.nm{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.08em;color:var(--gold);margin-top:2px}
.nm small.gray{color:var(--muted)}
.sts{display:grid;grid-template-columns:repeat(2,minmax(46px,auto));gap:2px 14px;text-align:left}
.sts span{font-family:var(--display);font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.06em}
.sts b{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.none{color:var(--muted);text-align:center;padding:24px 8px}

/* modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(3,6,16,.72);padding:20px}
.mbox{width:min(100%,360px);background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 0 30px rgba(47,125,255,.35)}
.mbox h3{margin:0;font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;text-wrap:balance}
.mbox p{margin:0;color:var(--muted)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mbtn{min-width:90px;height:46px;padding:0 16px;border-radius:8px;font-family:var(--display);font-weight:800;font-style:italic;font-size:20px;background:linear-gradient(#5aa0ff,#1b5be0);border:1.5px solid #9cc2ff}
.mbtn.alt{background:var(--card2);border-color:var(--line)}
.mbtn.danger{background:linear-gradient(#e0414f,#9a1424);border-color:#ff9aa3}

/* menu */
.hero{text-align:center;padding:26px 0 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero .trophy{width:84px;height:84px;filter:drop-shadow(0 0 18px rgba(242,181,38,.45))}
.hero h1{margin:0;font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(46px,14vw,72px);line-height:.9;text-transform:uppercase;text-shadow:0 4px 0 #0d2c78,0 0 30px rgba(47,125,255,.5)}
.hero h1 em{color:var(--gold);font-style:inherit}
.hero p{margin:0;color:var(--muted);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.modebtn{position:relative;display:block;width:100%;height:auto;margin-top:14px;text-align:left}
.modebtn span{display:flex;flex-direction:column;gap:2px;transform:skewX(-10deg);padding:14px 22px;border-radius:8px;border:2px solid #9cc2ff;background:linear-gradient(#3e8bff,#1b5be0);box-shadow:0 0 18px rgba(47,125,255,.55),0 5px 0 #0d2c78}
.modebtn.red span{border-color:#ff9aa3;background:linear-gradient(#e0414f,#9a1424);box-shadow:0 0 18px rgba(204,33,51,.55),0 5px 0 #4e0811}
.modebtn b,.modebtn small{transform:skewX(10deg)}
.modebtn b{font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;line-height:1;text-transform:uppercase}
.modebtn small{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);max-width:40ch}
.panel{background:rgba(13,20,48,.92);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px}
.panel h2{margin:0 0 10px;font-family:var(--display);font-weight:800;font-style:italic;font-size:22px;text-transform:uppercase}
.rules{margin:0;padding-left:18px;color:#c3cbea;display:flex;flex-direction:column;gap:6px;font-size:14px}
.best{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.best li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:var(--card2);border-radius:9px}
.best .rec{font-family:var(--display);font-weight:900;font-style:italic;font-size:24px}
.best .rec.champ{color:var(--gold)}
.best .meta{font-size:12.5px;color:#c3cbea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.best .dt{font-size:11px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin-top:16px;padding-bottom:20px}

/* results */
.res-top{text-align:center;padding-top:8px}
.bigrec{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(84px,26vw,130px);line-height:.9;text-shadow:0 5px 0 #0d2c78,0 0 30px rgba(47,125,255,.5);font-variant-numeric:tabular-nums}
.bigrec.champ{color:var(--gold);text-shadow:0 5px 0 #6b4a05,0 0 34px rgba(242,181,38,.55)}
.verdict{font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;text-transform:uppercase;min-height:1.2em;text-wrap:balance}
.vsub{color:var(--muted);margin:4px auto 0;max-width:40ch;min-height:1.4em}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grade{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.grade span{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.grade b{display:block;font-family:var(--display);font-weight:900;font-style:italic;font-size:38px;line-height:1}
.grade small{color:var(--muted);font-size:12px}
.games{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.games li{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.games li[hidden]{display:none}
.games .wk{font-family:var(--display);font-weight:700;color:var(--muted);font-size:14px}
.games .op{font-family:var(--display);font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.games .r{font-family:var(--display);font-weight:900;font-style:italic;font-size:20px}
.games .r i{font-style:normal;font-weight:600;font-size:14px;color:var(--muted);margin-left:6px}
.games li.W .r{color:var(--win)}.games li.L .r{color:var(--loss)}
.games li.nc{border-color:var(--gold);box-shadow:0 0 12px rgba(242,181,38,.25)}
.games li.show{animation:slide .35s ease-out}
@keyframes slide{from{transform:translateX(-14px);opacity:.3}to{transform:none;opacity:1}}
.roster-rev{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rv{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--card2);border-radius:8px;padding:6px 8px}
.rv .p{font-family:var(--display);font-weight:800;font-size:12px;color:var(--muted)}
.rv .w{font-family:var(--display);font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .w small{display:block;font-family:var(--body);font-weight:600;font-size:10.5px;color:var(--muted)}
.rv .o{font-family:var(--display);font-weight:900;font-style:italic;font-size:20px;color:var(--gold)}
@media (max-width:420px){.roster-rev{grid-template-columns:1fr}}
.actions{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding-bottom:24px}
.textbtn{margin-top:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;padding:10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--card);border:1.5px solid var(--gold);color:var(--text);font-weight:600;padding:10px 16px;border-radius:10px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const unlimited=()=>S&&S.mode==='natty';

function pickable(sp){const L=DB[sp.team][sp.dec];return POS.some(pos=>(L[pos]||[]).some(p=>!onRoster(p.name))&&openSlotsFor(pos).length)}
const rollTeam=(conf,avoid)=>{const o=teamsIn(conf);return pick(o.length>1?o.filter(t=>t!==avoid):o)};
const rollDec=(team,avoid)=>{const o=decadesFor(team);return pick(o.length>1?o.filter(d=>d!==avoid):o)};
function freshSpin(){let s,n=0;do{const conf=pick(CONFS.filter(c=>teamsIn(c).length));const team=rollTeam(conf);s={conf,team,dec:rollDec(team)};n++}while(!pickable(s)&&n<300);return s}

/* ---------- reels ---------- */
const IH=52,WH=78;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const reelText={conf:sp=>CONF_SHORT[sp.conf],team:sp=>TEAMINFO[sp.team][0],dec:sp=>DEC_SHORT[sp.dec]};
const reelPool={conf:()=>Object.values(CONF_SHORT),team:()=>Object.values(TEAMINFO).map(t=>t[0]),dec:()=>DEC_KEYS.map(d=>d[2])};
const off=i=>(WH-IH)/2-i*IH;
function setReel(key,text,isQ){
  const strip=document.getElementById('strip-'+key);if(!strip)return;
  strip.style.transition='none';
  strip.innerHTML=`<div class="item ${isQ?'q':''}">${text}</div>`;
  strip.style.transform=`translateY(${off(0)}px)`;
}
function spinReel(key,from,to,dur){
  return new Promise(res=>{
    const strip=document.getElementById('strip-'+key);if(!strip)return res();
    if(reduce){setReel(key,to);return res()}
    const pool=reelPool[key]();const N=18+Math.round(dur/90);const items=[from];
    for(let i=0;i<N;i++){let v;do{v=pick(pool)}while(v===items[items.length-1]);items.push(v)}
    items.push(to);let nx;do{nx=pick(pool)}while(nx===to);items.push(nx);
    strip.style.transition='none';
    strip.innerHTML=items.map(v=>`<div class="item ${v==='?'?'q':''}">${v}</div>`).join('');
    strip.style.transform=`translateY(${off(0)}px)`;
    strip.getBoundingClientRect();
    strip.style.transition=`transform ${dur}ms cubic-bezier(.12,.72,.2,1.06)`;
    strip.style.transform=`translateY(${off(items.length-2)}px)`;
    let done=false;const fin=()=>{if(done)return;done=true;setReel(key,to);res()};
    strip.addEventListener('transitionend',fin,{once:true});setTimeout(fin,dur+120);
  });
}
let lastShown={conf:'?',team:'?',dec:'?'};
async function runSpin(keys,sp,durs){
  S.busy=true;updateControls();
  await Promise.all(keys.map((k,i)=>spinReel(k,lastShown[k],reelText[k](sp),durs[i])));
  keys.forEach(k=>lastShown[k]=reelText[k](sp));
  S.busy=false;updateControls();
}

async function reroll(which){
  if(S.busy||!S.spin)return;
  if(!unlimited()){if(S.rr[which]<=0)return;S.rr[which]--}
  const s={...S.spin};let keys=[which],durs=[1400];
  if(which==='conf'){const o=CONFS.filter(c=>c!==s.conf&&teamsIn(c).length);s.conf=pick(o);s.team=rollTeam(s.conf);keys=['conf','team'];durs=[1300,1900];
    if(!decadesFor(s.team).includes(s.dec)){s.dec=rollDec(s.team);keys.push('dec');durs.push(2300)}}
  else if(which==='team'){s.team=rollTeam(s.conf,s.team);if(!decadesFor(s.team).includes(s.dec)){s.dec=rollDec(s.team);keys.push('dec');durs.push(1900)}}
  else s.dec=rollDec(s.team,s.dec);
  S.spin=s;S.filter='ALL';S.q='';
  closeSheet(true);
  await runSpin(keys,s,durs);

}

const CUPCAKE=['Kent State','Akron','UMass','New Mexico State','Charlotte','Georgia State','UTEP','Ball State','Bowling Green','Louisiana-Monroe'];
const MID=['Iowa','Wisconsin','Kansas State','Utah','Ole Miss','Arkansas','Virginia Tech','Louisville','Baylor','TCU','Washington','UCLA','Missouri','Kentucky','Michigan State','Oklahoma State','South Carolina','Texas A&M','Arizona State','Pitt'];
const ELITE=['Alabama','Georgia','Ohio State','Michigan','Texas','LSU','Clemson','Oregon','USC','Notre Dame','Florida State','Penn State','Miami','Oklahoma'];
function ratings(){const side=sd=>{let s=0,w=0;for(const sl of SLOTS.filter(x=>x.side===sd)){s+=S.roster[sl.id].ovr*sl.w;w+=sl.w}return s/w};const o=side('O'),d=side('D');return{off:o,def:d,ovr:o*.55+d*.45}}
const winP=(us,them)=>1/(1+Math.exp(-(us-them)/2.9));
function score(win,margin){const base=win?17+Math.round(Math.random()*24):10+Math.round(Math.random()*17);const m=Math.max(1,Math.round(margin));return win?[base+m,base]:[base,base+m]}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function simulate(){
  const R=ratings();
  const opp=[...shuffle(CUPCAKE).slice(0,3).map(n=>({n,r:63+Math.random()*9})),...shuffle(MID).slice(0,5).map(n=>({n,r:75+Math.random()*9})),...shuffle(ELITE).slice(0,4).map(n=>({n,r:84+Math.random()*7}))];
  const games=[];let w=0;
  for(const g of shuffle(opp)){const win=Math.random()<winP(R.ovr+(Math.random()*4-2),g.r);if(win)w++;games.push({...g,win,sc:score(win,Math.abs(R.ovr-g.r)/2+Math.random()*10)})}
  let bowl;
  if(w>=11){const o={n:pick(ELITE),r:89+Math.random()*5};const win=Math.random()<winP(R.ovr,o.r);bowl={...o,win,title:true,sc:score(win,2+Math.random()*12)}}
  else{const o={n:pick(MID),r:76+Math.random()*8};const win=Math.random()<winP(R.ovr,o.r);bowl={...o,win,title:false,sc:score(win,3+Math.random()*12)}}
  return{R,games,w,bowl};
}

  else{head=r.w>=9?'Good year, no title shot':'Rebuilding year';sub=`You needed 11 wins to play for the title. ${b.win?'You did win the bowl.':'The bowl got away too.'}`}
  const list=[...r.games.map((g,i)=>({...g,wk:'WK '+(i+1)})),{...b,wk:b.title?'NC':'BOWL'}];
  const rev=SLOTS.map(s=>{const p=S.roster[s.id];return `<div class="rv"><span class="p">${s.lbl}</span><span class="w">${esc(p.name)}<small>${esc(TEAMINFO[p.team][0])} ${DEC_SHORT[p.dec]} · ${p.pos}</small></span><span class="o">${p.ovr}</span></div>`}).join('');
  app.innerHTML=`<div class="screen">
   <div class="topbar"><button class="back" data-act="quit" aria-label="Back to menu">${ICON.back}</button><div class="round" style="margin:0">Season results</div><span></span></div>
   <div class="res-top"><div class="bigrec" id="bigrec">0-0</div><div class="verdict" id="verdict">Simulating…</div><p class="vsub" id="vsub"></p></div>
   <div class="grades"><div class="grade"><span>OFFENSE</span><b>${letter(R.off)}</b><small>${R.off.toFixed(1)}</small></div><div class="grade"><span>DEFENSE</span><b>${letter(R.def)}</b><small>${R.def.toFixed(1)}</small></div><div class="grade"><span>TEAM</span><b style="color:var(--gold)">${letter(R.ovr)}</b><small>${R.ovr.toFixed(1)} OVR</small></div></div>
   <div class="panel"><h2>Schedule</h2><ul class="games" id="games">${list.map(g=>`<li class="${g.win?'W':'L'} ${g.wk==='NC'?'nc':''}" hidden><span class="wk">${g.wk}</span><span class="op">${g.wk==='NC'?'Title game vs ':g.wk==='BOWL'?'Bowl vs ':''}${esc(g.n)}</span><span class="r">${g.win?'W':'L'}<i>${g.sc[0]}-${g.sc[1]}</i></span></li>`).join('')}</ul></div>
   <div class="panel"><h2>Ratings revealed</h2><div class="roster-rev">${rev}</div></div>
   <div class="actions"><button class="modebtn" data-act="resim"><span><b>Replay season</b><small>Same roster, new schedule. Not saved to best runs.</small></span></button>
   <button class="modebtn red" data-act="start" data-mode="${S.mode}"><span><b>New draft</b><small>${S.mode==='classic'?'Classic':'Natty or Bust'}</small></span></button>
   <button class="textbtn" data-act="quit">Main menu</button></div></div>`;
  window.scrollTo({top:0});
  const lis=[...document.querySelectorAll('#games li')];let W=0,Lo=0,i=0;const rec=document.getElementById('bigrec');
  const finish=()=>{rec.textContent=`${total}-${losses}`;rec.classList.toggle('champ',champ);document.getElementById('verdict').textContent=head;document.getElementById('vsub').textContent=sub};
  if(reduce){lis.forEach(l=>l.hidden=false);finish();return}
  const tick=()=>{if(i>=lis.length){finish();return}const li=lis[i];li.hidden=false;li.classList.add('show');li.classList.contains('W')?W++:Lo++;rec.textContent=`${W}-${Lo}`;i++;setTimeout(tick,i===lis.length-1?700:260)};
  setTimeout(tick,400);
}
function runSeason(save){resultsView(save)}

/* ---------- modal / toast ---------- */
function modal(html){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m);m.querySelector('button')?.focus()}
function closeModal(){document.getElementById('modal')?.remove()}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='start')newGame(el.dataset.mode);
  else if(a==='quit'){if(S&&!S.result&&filledCount()>0){modal(`<h3>Leave this draft?</h3><p>Your picks so far will be lost.</p><div class="mrow"><button class="mbtn danger" data-act="quitok">Leave</button><button class="mbtn alt" data-act="closemodal">Stay</button></div>`)}else menu()}
  else if(a==='quitok'){closeModal();menu()}
  else if(a==='draft')doDraft();
  else if(a==='reroll')reroll(el.dataset.w);
  else if(a==='freespin'){closeSheet(true);S.spin=null;doDraft()}
  else if(a==='hidesheet'){if(S.sheet){closeSheet();el.blur()}}
  else if(a==='filter'){S.filter=el.dataset.f;renderSheet()}
  else if(a==='choose')choosePlayer(+el.dataset.id);
  else if(a==='place')place(findPlayer(+el.dataset.id),el.dataset.slot);
  else if(a==='jersey')tapJersey(el.dataset.slot);
  else if(a==='cut')cut(el.dataset.slot);
  else if(a==='closemodal')closeModal();
  else if(a==='resim')runSeason(false);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act==='jersey'){e.preventDefault();e.target.click()}});
menu();
</script>
